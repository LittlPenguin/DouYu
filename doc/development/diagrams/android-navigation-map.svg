<svg viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .tab{fill:#083344;stroke:#22d3ee;rx:12;stroke-width:1.5}.route{fill:#064e3b;stroke:#34d399;rx:9;stroke-width:1.3}.ui{fill:#78350f;stroke:#fbbf24;rx:9;stroke-width:1.3}.legacy{fill:#4c1d95;stroke:#a78bfa;rx:9;stroke-width:1.3}
      .label{fill:#f8fafc;font-size:12px;font-weight:700}.small{fill:#cbd5e1;font-size:9.8px}.line{stroke:#94a3b8;stroke-width:1.3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1240" height="780" fill="#0f172a"/><rect width="1240" height="780" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Android Navigation Map</text>
  <text x="34" y="64" class="note">实线为当前 Android 路由；黄色为 Open Design UI-only / 待实现目标；详情和流程页通常隐藏底部导航</text>

  <rect x="500" y="92" width="240" height="70" class="tab"/><text x="620" y="122" text-anchor="middle" class="label">App Shell</text><text x="620" y="144" text-anchor="middle" class="small">Splash / Login / 5 Bottom Tabs</text>

  <g id="tabs">
    <rect x="60" y="230" width="160" height="62" class="tab"/><text x="140" y="255" text-anchor="middle" class="label">社区</text><text x="140" y="275" text-anchor="middle" class="small">community</text>
    <rect x="300" y="230" width="160" height="62" class="tab"/><text x="380" y="255" text-anchor="middle" class="label">商城</text><text x="380" y="275" text-anchor="middle" class="small">commerce</text>
    <rect x="540" y="230" width="160" height="62" class="tab"/><text x="620" y="255" text-anchor="middle" class="label">AI 拼图</text><text x="620" y="275" text-anchor="middle" class="small">ai</text>
    <rect x="780" y="230" width="160" height="62" class="tab"/><text x="860" y="255" text-anchor="middle" class="label">消息</text><text x="860" y="275" text-anchor="middle" class="small">message</text>
    <rect x="1020" y="230" width="160" height="62" class="tab"/><text x="1100" y="255" text-anchor="middle" class="label">我的</text><text x="1100" y="275" text-anchor="middle" class="small">profile</text>
  </g>

  <path d="M620 162 L140 230" class="line"/><path d="M620 162 L380 230" class="line"/><path d="M620 162 L620 230" class="line"/><path d="M620 162 L860 230" class="line"/><path d="M620 162 L1100 230" class="line"/>

  <g>
    <rect x="42" y="350" width="196" height="46" class="route"/><text x="140" y="379" text-anchor="middle" class="small">post/{postId}</text>
    <rect x="42" y="410" width="196" height="46" class="route"/><text x="140" y="439" text-anchor="middle" class="small">post_create / image_select / camera</text>
    <rect x="42" y="470" width="196" height="46" class="ui"/><text x="140" y="499" text-anchor="middle" class="small">Search UI-only</text>
  </g>

  <g>
    <rect x="282" y="350" width="196" height="46" class="route"/><text x="380" y="379" text-anchor="middle" class="small">product_list / product/{id}</text>
    <rect x="282" y="410" width="196" height="46" class="route"/><text x="380" y="439" text-anchor="middle" class="small">cart / order_confirm</text>
    <rect x="282" y="470" width="196" height="46" class="route"/><text x="380" y="499" text-anchor="middle" class="small">payment_result/{orderId}</text>
  </g>

  <g>
    <rect x="522" y="350" width="196" height="46" class="route"/><text x="620" y="379" text-anchor="middle" class="small">ai_params/{fileId}</text>
    <rect x="522" y="410" width="196" height="46" class="route"/><text x="620" y="439" text-anchor="middle" class="small">ai_progress/{jobId}</text>
    <rect x="522" y="470" width="196" height="46" class="route"/><text x="620" y="499" text-anchor="middle" class="small">pattern/{id} / history</text>
    <rect x="522" y="530" width="196" height="46" class="ui"/><text x="620" y="559" text-anchor="middle" class="small">未来生图 UI-only</text>
  </g>

  <g>
    <rect x="762" y="350" width="196" height="46" class="route"/><text x="860" y="379" text-anchor="middle" class="small">conversation/{id}</text>
    <rect x="762" y="410" width="196" height="46" class="ui"/><text x="860" y="439" text-anchor="middle" class="small">notification-detail UI-only</text>
  </g>

  <g>
    <rect x="1002" y="350" width="196" height="46" class="route"/><text x="1100" y="379" text-anchor="middle" class="small">my_patterns / favorites</text>
    <rect x="1002" y="410" width="196" height="46" class="legacy"/><text x="1100" y="439" text-anchor="middle" class="small">历史互动作品路由</text>
    <rect x="1002" y="470" width="196" height="46" class="route"/><text x="1100" y="499" text-anchor="middle" class="small">my_orders / settings</text>
    <rect x="1002" y="530" width="196" height="46" class="ui"/><text x="1100" y="559" text-anchor="middle" class="small">profile-edit UI-only</text>
    <rect x="1002" y="590" width="196" height="46" class="ui"/><text x="1100" y="619" text-anchor="middle" class="small">Settings 子页 UI-only</text>
  </g>

  <path d="M140 292 L140 350" class="line"/><path d="M380 292 L380 350" class="line"/><path d="M620 292 L620 350" class="line"/><path d="M860 292 L860 350" class="line"/><path d="M1100 292 L1100 350" class="line"/>
  <path d="M238 493 C310 595 910 680 1002 613" class="line dash"/>
  <text x="610" y="692" class="small" text-anchor="middle">设计目标：主 Tab 顶部搜索进入 Search；新增菜单进入 Settings / AI / 上传帖子。当前 Android 需后续落地。</text>
</svg>
