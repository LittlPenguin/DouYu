<svg viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
    </marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .tab{fill:#083344;stroke:#22d3ee;rx:12;stroke-width:1.5}
      .route{fill:#064e3b;stroke:#34d399;rx:9;stroke-width:1.3}
      .ui{fill:#78350f;stroke:#fbbf24;rx:9;stroke-width:1.3}
      .label{fill:#f8fafc;font-size:12px;font-weight:700}
      .small{fill:#cbd5e1;font-size:9.8px}
      .line{stroke:#94a3b8;stroke-width:1.3;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1240" height="780" fill="#0f172a"/>
  <rect width="1240" height="780" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Android Navigation Map</text>
  <text x="34" y="64" class="note">Current retained Java/XML Android routes. Bottom navigation has four tabs; removed feature pages are not current routes.</text>

  <rect x="500" y="92" width="240" height="70" class="tab"/>
  <text x="620" y="122" text-anchor="middle" class="label">App Shell</text>
  <text x="620" y="144" text-anchor="middle" class="small">Splash / Login / 4 Bottom Tabs</text>

  <g id="tabs">
    <rect x="90" y="230" width="180" height="62" class="tab"/><text x="180" y="255" text-anchor="middle" class="label">Community</text><text x="180" y="275" text-anchor="middle" class="small">posts / search boundary</text>
    <rect x="360" y="230" width="180" height="62" class="tab"/><text x="450" y="255" text-anchor="middle" class="label">Commerce</text><text x="450" y="275" text-anchor="middle" class="small">products / cart / orders</text>
    <rect x="630" y="230" width="180" height="62" class="tab"/><text x="720" y="255" text-anchor="middle" class="label">Messages</text><text x="720" y="275" text-anchor="middle" class="small">notifications / conversations</text>
    <rect x="900" y="230" width="180" height="62" class="tab"/><text x="990" y="255" text-anchor="middle" class="label">Profile</text><text x="990" y="275" text-anchor="middle" class="small">profile / settings</text>
  </g>

  <path d="M620 162 L180 230" class="line"/>
  <path d="M620 162 L450 230" class="line"/>
  <path d="M620 162 L720 230" class="line"/>
  <path d="M620 162 L990 230" class="line"/>

  <g>
    <rect x="82" y="350" width="196" height="46" class="route"/><text x="180" y="379" text-anchor="middle" class="small">post/{postId}</text>
    <rect x="82" y="410" width="196" height="46" class="route"/><text x="180" y="439" text-anchor="middle" class="small">post_create / image_select</text>
    <rect x="82" y="470" width="196" height="46" class="ui"/><text x="180" y="499" text-anchor="middle" class="small">Search UI boundary</text>
  </g>

  <g>
    <rect x="352" y="350" width="196" height="46" class="route"/><text x="450" y="379" text-anchor="middle" class="small">product_list / product/{id}</text>
    <rect x="352" y="410" width="196" height="46" class="route"/><text x="450" y="439" text-anchor="middle" class="small">cart / order_confirm</text>
    <rect x="352" y="470" width="196" height="46" class="route"/><text x="450" y="499" text-anchor="middle" class="small">address / order records</text>
  </g>

  <g>
    <rect x="622" y="350" width="196" height="46" class="route"/><text x="720" y="379" text-anchor="middle" class="small">conversation/{id}</text>
    <rect x="622" y="410" width="196" height="46" class="ui"/><text x="720" y="439" text-anchor="middle" class="small">notification-detail UI boundary</text>
  </g>

  <g>
    <rect x="892" y="350" width="196" height="46" class="route"/><text x="990" y="379" text-anchor="middle" class="small">liked_posts / favorite_posts</text>
    <rect x="892" y="410" width="196" height="46" class="route"/><text x="990" y="439" text-anchor="middle" class="small">profile_edit</text>
    <rect x="892" y="470" width="196" height="46" class="route"/><text x="990" y="499" text-anchor="middle" class="small">settings child pages</text>
  </g>

  <path d="M180 292 L180 350" class="line"/>
  <path d="M450 292 L450 350" class="line"/>
  <path d="M720 292 L720 350" class="line"/>
  <path d="M990 292 L990 350" class="line"/>
  <path d="M278 493 C360 610 802 646 892 493" class="line dash"/>
  <text x="610" y="692" class="small" text-anchor="middle">Search, settings, address management, and OSS-backed uploads remain; removed feature routes are not part of this map.</text>
</svg>
