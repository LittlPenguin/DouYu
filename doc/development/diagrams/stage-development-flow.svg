<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .stage{rx:14;stroke-width:1.6}.s0{fill:#1e293b;stroke:#94a3b8}.s1{fill:#083344;stroke:#22d3ee}.s2{fill:#064e3b;stroke:#34d399}.s3{fill:#78350f;stroke:#fbbf24}.s4{fill:#4c1d95;stroke:#a78bfa}.s5{fill:#881337;stroke:#fb7185}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10.5px}.line{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="720" fill="#0f172a"/><rect width="1180" height="720" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Stage Development Flow</text>
  <text x="34" y="64" class="note">先文档/API/图谱对齐，再按设计图落地 Android UI，最后真机 QA 与验收关闭</text>
  <rect x="60" y="122" width="230" height="88" class="stage s0"/><text x="175" y="154" text-anchor="middle" class="label">Stage 0</text><text x="175" y="178" text-anchor="middle" class="small">文档 / API / 图谱对齐</text>
  <rect x="360" y="122" width="230" height="88" class="stage s1"/><text x="475" y="154" text-anchor="middle" class="label">Stage 1</text><text x="475" y="178" text-anchor="middle" class="small">UI Shell 与设计系统</text>
  <rect x="660" y="122" width="230" height="88" class="stage s2"/><text x="775" y="154" text-anchor="middle" class="label">Stage 2</text><text x="775" y="178" text-anchor="middle" class="small">社区首页与作品详情</text>
  <rect x="60" y="302" width="230" height="88" class="stage s3"/><text x="175" y="334" text-anchor="middle" class="label">Stage 3</text><text x="175" y="358" text-anchor="middle" class="small">发帖 / Search / Settings / Profile</text>
  <rect x="360" y="302" width="230" height="88" class="stage s4"/><text x="475" y="334" text-anchor="middle" class="label">Stage 4</text><text x="475" y="358" text-anchor="middle" class="small">消息 / 私信 / 通知</text>
  <rect x="660" y="302" width="230" height="88" class="stage s5"/><text x="775" y="334" text-anchor="middle" class="label">Stage 5</text><text x="775" y="358" text-anchor="middle" class="small">商城 / 订单 / 联调支付</text>
  <rect x="210" y="482" width="230" height="88" class="stage s1"/><text x="325" y="514" text-anchor="middle" class="label">Stage 6</text><text x="325" y="538" text-anchor="middle" class="small">AI 开发态 / 未来能力 UI-only</text>
  <rect x="560" y="482" width="230" height="88" class="stage s2"/><text x="675" y="514" text-anchor="middle" class="label">Stage 7</text><text x="675" y="538" text-anchor="middle" class="small">真机 QA / 接口回归 / 关闭</text>
  <rect x="920" y="230" width="210" height="210" class="stage s0"/><text x="1025" y="264" text-anchor="middle" class="label">每阶段退出标准</text><text x="1025" y="292" text-anchor="middle" class="small">文档同步</text><text x="1025" y="318" text-anchor="middle" class="small">接口边界不变</text><text x="1025" y="344" text-anchor="middle" class="small">未完成能力不误导</text><text x="1025" y="370" text-anchor="middle" class="small">测试 / QA 有证据</text>
  <path d="M290 166 L360 166" class="line"/><path d="M590 166 L660 166" class="line"/><path d="M775 210 C775 260 230 248 175 302" class="line"/><path d="M290 346 L360 346" class="line"/><path d="M590 346 L660 346" class="line"/><path d="M775 390 C775 455 420 430 325 482" class="line"/><path d="M440 526 L560 526" class="line"/>
</svg>
