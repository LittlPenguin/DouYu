  <rect x="512" y="748" width="316" height="58" rx="22" class="card"/>
  <text x="544" y="782" class="small">社区</text><text x="610" y="782" class="small">商城</text><text x="672" y="782" class="small">AI</text><text x="734" y="782" class="small">消息</text><text x="796" y="782" class="small">我的</text>
