  <rect x="72" y="374" width="316" height="82" rx="16" class="mint"/><circle cx="102" cy="415" r="18" fill="#fff"/><text x="132" y="410" class="small">私信会话</text><text x="132" y="432" class="small">mutualFollow / remaining / canSend</text>
  <rect x="72" y="490" width="316" height="76" rx="18" class="petal"/><text x="230" y="522" text-anchor="middle" class="label">未互关 3 条限制</text><text x="230" y="546" text-anchor="middle" class="small">超过后禁用输入，提示互相关注后继续</text>
  <rect x="72" y="748" width="316" height="58" rx="22" class="card"/>
