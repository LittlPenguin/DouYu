<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text{font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif}
      .bg{fill:#FFFBF7}.phone{fill:#fff;stroke:#E0CDD0;stroke-width:2;rx:32}.bar{fill:#FFF0F3;stroke:#E0CDD0;rx:16}
      .petal{fill:#F48FA4}.mint{fill:#D4F0E0;stroke:#7DB89A;rx:14}.sky{fill:#D6E8FF;stroke:#7AADE0;rx:14}.coral{fill:#FFE8DD;stroke:#FF8F75;rx:14}.card{fill:#fff;stroke:#E0CDD0;rx:16}
      .label{fill:#2F2528;font-size:16px;font-weight:800}.small{fill:#5F5257;font-size:12px}.tiny{fill:#7A6B70;font-size:10px}
    </style>
  </defs>
  <rect width="1040" height="760" class="bg"/>
  <text x="38" y="48" class="label">Messages And Profile Wireframes</text>
  <text x="38" y="70" class="small">Messages use real notification/conversation lists. Profile keeps liked and favorite post tabs plus OSS avatar upload.</text>

  <rect x="80" y="104" width="330" height="620" class="phone"/>
  <rect x="106" y="132" width="278" height="48" class="bar"/><circle cx="132" cy="156" r="13" class="petal"/><text x="245" y="162" text-anchor="middle" class="label">Messages</text><circle cx="358" cy="156" r="13" fill="#9EC9F5"/>
  <rect x="106" y="202" width="128" height="34" rx="17" fill="#FFE0E6"/><text x="170" y="224" text-anchor="middle" class="small">Chats</text>
  <rect x="254" y="202" width="128" height="34" rx="17" fill="#fff" stroke="#E0CDD0"/><text x="318" y="224" text-anchor="middle" class="small">Notices</text>
  <rect x="106" y="260" width="278" height="88" class="card"/><text x="134" y="290" class="small">Conversation</text><text x="134" y="314" class="tiny">last message / unread count</text><text x="134" y="334" class="tiny">mutual-follow chat</text>
  <rect x="106" y="368" width="278" height="88" class="coral"/><text x="134" y="398" class="small">Limited chat state</text><text x="134" y="422" class="tiny">remaining message boundary</text>
  <rect x="106" y="482" width="278" height="88" class="sky"/><text x="134" y="512" class="small">Notification detail</text><text x="134" y="536" class="tiny">read-only event view</text>
  <rect x="106" y="674" width="278" height="40" rx="20" fill="#FFFAF7" stroke="#E0CDD0"/>
  <circle cx="130" cy="690" r="4" fill="#7A6B70"/><text x="130" y="704" text-anchor="middle" class="tiny">Community</text>
  <circle cx="196" cy="690" r="4" fill="#7A6B70"/><text x="196" y="704" text-anchor="middle" class="tiny">Commerce</text>
  <rect x="242" y="680" width="58" height="28" rx="14" fill="#FFE0E6"/><circle cx="271" cy="690" r="4" class="petal"/><text x="271" y="704" text-anchor="middle" class="tiny">Messages</text><rect x="259" y="709" width="24" height="3" rx="2" class="petal"/>
  <circle cx="350" cy="690" r="4" fill="#7A6B70"/><text x="350" y="704" text-anchor="middle" class="tiny">Profile</text>

  <rect x="630" y="104" width="330" height="620" class="phone"/>
  <rect x="656" y="132" width="278" height="48" class="bar"/><circle cx="682" cy="156" r="13" class="petal"/><text x="795" y="162" text-anchor="middle" class="label">Profile</text><circle cx="908" cy="156" r="13" fill="#9EC9F5"/>
  <rect x="656" y="202" width="278" height="96" class="card"/><circle cx="696" cy="236" r="24" class="mint"/><text x="734" y="230" class="small">SpellBean user</text><text x="734" y="254" class="tiny">bio / level / edit profile</text><rect x="824" y="230" width="84" height="28" rx="14" class="sky"/><text x="866" y="248" text-anchor="middle" class="tiny">Edit</text>
  <rect x="656" y="318" width="278" height="66" class="bar"/><text x="690" y="346" text-anchor="middle" class="tiny">Likes</text><text x="760" y="346" text-anchor="middle" class="tiny">Posts</text><text x="830" y="346" text-anchor="middle" class="tiny">Following</text><text x="900" y="346" text-anchor="middle" class="tiny">Fans</text><text x="690" y="368" text-anchor="middle" class="small">128</text><text x="760" y="368" text-anchor="middle" class="small">24</text><text x="830" y="368" text-anchor="middle" class="small">56</text><text x="900" y="368" text-anchor="middle" class="small">89</text>
  <rect x="656" y="410" width="118" height="32" rx="16" fill="#FFE0E6"/><text x="715" y="431" text-anchor="middle" class="tiny">Liked posts</text>
  <rect x="790" y="410" width="118" height="32" rx="16" fill="#fff" stroke="#E0CDD0"/><text x="849" y="431" text-anchor="middle" class="tiny">Favorite posts</text>
  <rect x="656" y="464" width="128" height="126" class="card"/><rect x="670" y="478" width="100" height="58" class="mint"/><text x="670" y="562" class="tiny">post card</text>
  <rect x="806" y="464" width="128" height="126" class="card"/><rect x="820" y="478" width="100" height="58" class="sky"/><text x="820" y="562" class="tiny">post card</text>
  <rect x="656" y="614" width="278" height="48" class="coral"/><text x="795" y="642" text-anchor="middle" class="tiny">Orders and comments are not shown in the profile first viewport.</text>
  <rect x="656" y="674" width="278" height="40" rx="20" fill="#FFFAF7" stroke="#E0CDD0"/>
  <circle cx="680" cy="690" r="4" fill="#7A6B70"/><text x="680" y="704" text-anchor="middle" class="tiny">Community</text>
  <circle cx="746" cy="690" r="4" fill="#7A6B70"/><text x="746" y="704" text-anchor="middle" class="tiny">Commerce</text>
  <circle cx="814" cy="690" r="4" fill="#7A6B70"/><text x="814" y="704" text-anchor="middle" class="tiny">Messages</text>
  <rect x="876" y="680" width="58" height="28" rx="14" fill="#FFE0E6"/><circle cx="905" cy="690" r="4" class="petal"/><text x="905" y="704" text-anchor="middle" class="tiny">Profile</text><rect x="893" y="709" width="24" height="3" rx="2" class="petal"/>
</svg>
