<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860">
  <style>
    text{font-family:"Noto Sans SC","PingFang SC",sans-serif}.bg{fill:#FFFBF7}.card{fill:#fff;stroke:#E0CDD0;stroke-width:1.2}.petal{fill:#FFE0E6;stroke:#F48FA4}.mint{fill:#D4F0E0;stroke:#7DB89A}.sky{fill:#D6E8FF;stroke:#7AADE0}.coral{fill:#FFE1D8;stroke:#FF8F75}.label{fill:#201A1C;font-size:13px;font-weight:800}.small{fill:#524347;font-size:10px}
  </style>
  <rect width="900" height="860" class="bg"/>
