<svg viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .box{rx:12;stroke-width:1.5}.ui{fill:#083344;stroke:#22d3ee}.api{fill:#064e3b;stroke:#34d399}.decision{fill:#78350f;stroke:#fbbf24}.warn{fill:#881337;stroke:#fb7185}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10.5px}.line{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="640" fill="#0f172a"/><rect width="1120" height="640" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Message Mutual Follow Flow</text>
  <text x="34" y="64" class="note">好友第一版是关注 / 互相关注语义；未互关同会话同发送者最多 3 条</text>
  <rect x="70" y="130" width="210" height="78" class="box ui"/><text x="175" y="162" text-anchor="middle" class="label">进入会话详情</text><text x="175" y="185" text-anchor="middle" class="small">GET /conversations/{id}</text>
  <rect x="340" y="130" width="220" height="78" class="box api"/><text x="450" y="162" text-anchor="middle" class="label">会话字段</text><text x="450" y="185" text-anchor="middle" class="small">mutualFollow / remaining / canSend</text>
  <rect x="620" y="120" width="210" height="98" class="box decision"/><text x="725" y="154" text-anchor="middle" class="label">mutualFollow?</text><text x="725" y="178" text-anchor="middle" class="small">双方关注</text>
  <rect x="880" y="90" width="190" height="78" class="box api"/><text x="975" y="122" text-anchor="middle" class="label">正常发送</text><text x="975" y="145" text-anchor="middle" class="small">POST message</text>
  <rect x="880" y="220" width="190" height="78" class="box decision"/><text x="975" y="252" text-anchor="middle" class="label">剩余条数 &gt; 0?</text><text x="975" y="275" text-anchor="middle" class="small">最多 3 条</text>
  <rect x="620" y="370" width="210" height="82" class="box api"/><text x="725" y="402" text-anchor="middle" class="label">允许发送并递减</text><text x="725" y="426" text-anchor="middle" class="small">保留剩余提示</text>
  <rect x="880" y="370" width="190" height="82" class="box warn"/><text x="975" y="402" text-anchor="middle" class="label">禁用输入</text><text x="975" y="426" text-anchor="middle" class="small">互相关注后可继续聊天</text>
  <rect x="310" y="500" width="280" height="76" class="box warn"/><text x="450" y="530" text-anchor="middle" class="label">不做</text><text x="450" y="552" text-anchor="middle" class="small">好友申请审批 / 图片私信 / 撤回</text>
  <path d="M280 169 L340 169" class="line"/><path d="M560 169 L620 169" class="line"/><path d="M830 145 L880 129" class="line"/><path d="M830 190 L880 259" class="line"/><path d="M975 298 C950 350 790 330 725 370" class="line"/><path d="M975 298 L975 370" class="line"/>
  <text x="850" y="126" class="small">是</text><text x="850" y="242" class="small">否</text><text x="910" y="340" class="small">否</text><text x="786" y="348" class="small">是</text>
</svg>
