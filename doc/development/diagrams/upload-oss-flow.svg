<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .box{rx:12;stroke-width:1.5}.client{fill:#083344;stroke:#22d3ee}.api{fill:#064e3b;stroke:#34d399}.oss{fill:#78350f;stroke:#fbbf24}.data{fill:#4c1d95;stroke:#a78bfa}.warn{fill:#881337;stroke:#fb7185}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10.5px}.line{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1180" height="640" fill="#0f172a"/><rect width="1180" height="640" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Upload OSS Flow</text>
  <text x="34" y="64" class="note">Android 只拿预签名 URL 直传；业务只使用 confirm 返回的 fileId</text>

  <rect x="54" y="130" width="180" height="78" class="box client"/><text x="144" y="161" text-anchor="middle" class="label">Android</text><text x="144" y="184" text-anchor="middle" class="small">选择图片 / 文件</text>
  <rect x="290" y="130" width="210" height="78" class="box api"/><text x="395" y="161" text-anchor="middle" class="label">POST /uploads/presign</text><text x="395" y="184" text-anchor="middle" class="small">usage / mime / size / name</text>
  <rect x="560" y="96" width="210" height="78" class="box oss"/><text x="665" y="127" text-anchor="middle" class="label">OSS Provider</text><text x="665" y="150" text-anchor="middle" class="small">local | aliyun</text>
  <rect x="560" y="220" width="210" height="78" class="box oss"/><text x="665" y="251" text-anchor="middle" class="label">PUT uploadUrl</text><text x="665" y="274" text-anchor="middle" class="small">headers + binary</text>
  <rect x="830" y="130" width="230" height="78" class="box api"/><text x="945" y="161" text-anchor="middle" class="label">POST /uploads/confirm</text><text x="945" y="184" text-anchor="middle" class="small">fileKey -> FileAsset</text>
  <rect x="830" y="300" width="230" height="78" class="box data"/><text x="945" y="331" text-anchor="middle" class="label">FileAsset</text><text x="945" y="354" text-anchor="middle" class="small">fileId / publicUrl / audit</text>
  <rect x="290" y="430" width="250" height="82" class="box api"/><text x="415" y="462" text-anchor="middle" class="label">业务提交</text><text x="415" y="485" text-anchor="middle" class="small">avatar / post / comment / product 使用 fileId</text>
  <rect x="690" y="430" width="370" height="82" class="box warn"/><text x="875" y="462" text-anchor="middle" class="label">保留边界</text><text x="875" y="485" text-anchor="middle" class="small">OSS provider / uploadUrl / confirm / fileId</text>

  <path d="M234 169 L290 169" class="line"/><path d="M500 169 L560 135" class="line"/><path d="M665 174 L665 220" class="line"/><path d="M770 259 L830 169" class="line"/>
  <path d="M945 208 L945 300" class="line"/><path d="M830 339 C640 350 520 390 415 430" class="line"/>
  <path d="M1060 169 C1120 230 1120 390 1060 471" class="line dash"/>
</svg>
