<svg viewBox="0 0 1180 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}
      .small{fill:#cbd5e1;font-size:10.5px}
      .module{rx:10;stroke-width:1.4}
      .core{fill:#064e3b;stroke:#34d399}
      .user{fill:#083344;stroke:#22d3ee}
      .commerce{fill:#78350f;stroke:#fbbf24}
      .admin{fill:#4c1d95;stroke:#a78bfa}
      .warn{fill:#881337;stroke:#fb7185}
      .line{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1180" height="740" fill="#0f172a"/>
  <rect width="1180" height="740" fill="url(#grid)"/>
  <text x="34" y="42" class="title">API 模块地图</text>
  <text x="34" y="64" class="note">以当前 Controller 与 Android Retrofit 为源；Search、地图、真实支付、大模型生图不新增公共契约</text>

  <rect x="462" y="96" width="256" height="112" class="module core"/>
  <text x="590" y="132" text-anchor="middle" class="label">/api/v1</text>
  <text x="590" y="156" text-anchor="middle" class="small">统一响应 code / message / data / traceId</text>
  <text x="590" y="178" text-anchor="middle" class="small">JWT 鉴权 + Idempotency-Key</text>

  <g>
    <rect x="64" y="250" width="170" height="76" class="module user"/>
    <text x="149" y="280" text-anchor="middle" class="label">Auth</text>
    <text x="149" y="302" text-anchor="middle" class="small">register / login / refresh / logout</text>
    <rect x="260" y="250" width="170" height="76" class="module user"/>
    <text x="345" y="280" text-anchor="middle" class="label">User</text>
    <text x="345" y="302" text-anchor="middle" class="small">me / follow / search</text>
    <rect x="456" y="250" width="170" height="76" class="module user"/>
    <text x="541" y="280" text-anchor="middle" class="label">Upload</text>
    <text x="541" y="302" text-anchor="middle" class="small">presign / confirm</text>
    <rect x="652" y="250" width="170" height="76" class="module user"/>
    <text x="737" y="280" text-anchor="middle" class="label">Community</text>
    <text x="737" y="302" text-anchor="middle" class="small">posts / comments / topics</text>
    <rect x="848" y="250" width="170" height="76" class="module user"/>
    <text x="933" y="280" text-anchor="middle" class="label">Message</text>
    <text x="933" y="302" text-anchor="middle" class="small">notifications / conversations</text>
  </g>

  <g>
    <rect x="64" y="404" width="170" height="76" class="module commerce"/>
    <text x="149" y="434" text-anchor="middle" class="label">Pattern</text>
    <text x="149" y="456" text-anchor="middle" class="small">jobs / pattern / quota</text>
    <rect x="260" y="404" width="170" height="76" class="module commerce"/>
    <text x="345" y="434" text-anchor="middle" class="label">Product</text>
    <text x="345" y="456" text-anchor="middle" class="small">products / player publish</text>
    <rect x="456" y="404" width="170" height="76" class="module commerce"/>
    <text x="541" y="434" text-anchor="middle" class="label">Cart</text>
    <text x="541" y="456" text-anchor="middle" class="small">cart items</text>
    <rect x="652" y="404" width="170" height="76" class="module commerce"/>
    <text x="737" y="434" text-anchor="middle" class="label">Order</text>
    <text x="737" y="456" text-anchor="middle" class="small">orders + idempotency</text>
    <rect x="848" y="404" width="170" height="76" class="module commerce"/>
    <text x="933" y="434" text-anchor="middle" class="label">Payment</text>
    <text x="933" y="456" text-anchor="middle" class="small">payments / callbacks / refunds</text>
  </g>

  <g>
    <rect x="260" y="558" width="170" height="76" class="module admin"/>
    <text x="345" y="588" text-anchor="middle" class="label">Reward</text>
    <text x="345" y="610" text-anchor="middle" class="small">checkins / badges</text>
    <rect x="456" y="558" width="170" height="76" class="module admin"/>
    <text x="541" y="588" text-anchor="middle" class="label">Report</text>
    <text x="541" y="610" text-anchor="middle" class="small">POST /reports</text>
    <rect x="652" y="558" width="170" height="76" class="module admin"/>
    <text x="737" y="588" text-anchor="middle" class="label">Admin</text>
    <text x="737" y="610" text-anchor="middle" class="small">audit / logs / operation</text>
  </g>

  <rect x="848" y="558" width="240" height="76" class="module warn"/>
  <text x="968" y="588" text-anchor="middle" class="label">禁止误导为已接入</text>
  <text x="968" y="610" text-anchor="middle" class="small">地图 / 真实支付 / 生图 / 全局搜索</text>

  <path d="M590 208 L149 250" class="line"/>
  <path d="M590 208 L345 250" class="line"/>
  <path d="M590 208 L541 250" class="line"/>
  <path d="M590 208 L737 250" class="line"/>
  <path d="M590 208 L933 250" class="line"/>
  <path d="M590 208 L149 404" class="line"/>
  <path d="M590 208 L345 404" class="line"/>
  <path d="M590 208 L541 404" class="line"/>
  <path d="M590 208 L737 404" class="line"/>
  <path d="M590 208 L933 404" class="line"/>
  <path d="M590 208 L345 558" class="line"/>
  <path d="M590 208 L541 558" class="line"/>
  <path d="M590 208 L737 558" class="line"/>
  <path d="M848 596 L822 596" class="line dash"/>
</svg>
