<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:"JetBrains Mono","Noto Sans SC","PingFang SC",sans-serif}.bg{fill:#0f172a}.title{fill:#f8fafc;font-size:20px;font-weight:700}.note{fill:#94a3b8;font-size:10px}
      .api{fill:rgba(8,51,68,.55);stroke:#22d3ee;stroke-width:1.5}.svc{fill:rgba(6,78,59,.5);stroke:#34d399;stroke-width:1.5}.risk{fill:rgba(136,19,55,.42);stroke:#fb7185;stroke-width:1.5}
      .data{fill:rgba(76,29,149,.45);stroke:#a78bfa;stroke-width:1.5}.label{fill:#f8fafc;font-size:12px;font-weight:700}.small{fill:#cbd5e1;font-size:9px}.line{fill:none;stroke:#94a3b8;stroke-width:1.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="720" class="bg"/>
  <text x="34" y="38" class="title">API 模块地图</text>
  <text x="34" y="58" class="note">统一前缀 /api/v1；响应包装 { code, message, data, traceId }；写接口按契约使用 Idempotency-Key</text>
  <rect x="485" y="90" width="210" height="62" rx="8" class="svc"/><text x="590" y="114" text-anchor="middle" class="label">Spring Security</text><text x="590" y="132" text-anchor="middle" class="small">JWT / CurrentUser / traceId</text>
  <rect x="70" y="205" width="150" height="62" rx="8" class="api"/><text x="145" y="229" text-anchor="middle" class="label">Auth</text><text x="145" y="247" text-anchor="middle" class="small">sms / login / refresh</text>
  <rect x="250" y="205" width="150" height="62" rx="8" class="api"/><text x="325" y="229" text-anchor="middle" class="label">User</text><text x="325" y="247" text-anchor="middle" class="small">me / follow / assets</text>
  <rect x="430" y="205" width="150" height="62" rx="8" class="api"/><text x="505" y="229" text-anchor="middle" class="label">Upload</text><text x="505" y="247" text-anchor="middle" class="small">presign / confirm</text>
  <rect x="610" y="205" width="150" height="62" rx="8" class="api"/><text x="685" y="229" text-anchor="middle" class="label">Community</text><text x="685" y="247" text-anchor="middle" class="small">posts / comments</text>
  <rect x="790" y="205" width="150" height="62" rx="8" class="api"/><text x="865" y="229" text-anchor="middle" class="label">Pattern</text><text x="865" y="247" text-anchor="middle" class="small">jobs / results</text>
  <rect x="970" y="205" width="150" height="62" rx="8" class="api"/><text x="1045" y="229" text-anchor="middle" class="label">Admin</text><text x="1045" y="247" text-anchor="middle" class="small">API only</text>
  <rect x="160" y="342" width="150" height="62" rx="8" class="api"/><text x="235" y="366" text-anchor="middle" class="label">Product</text><text x="235" y="384" text-anchor="middle" class="small">products / sku</text>
  <rect x="340" y="342" width="150" height="62" rx="8" class="api"/><text x="415" y="366" text-anchor="middle" class="label">Cart</text><text x="415" y="384" text-anchor="middle" class="small">self operated only</text>
  <rect x="520" y="342" width="150" height="62" rx="8" class="api"/><text x="595" y="366" text-anchor="middle" class="label">Order</text><text x="595" y="384" text-anchor="middle" class="small">address boundary</text>
  <rect x="700" y="342" width="150" height="62" rx="8" class="risk"/><text x="775" y="366" text-anchor="middle" class="label">Payment</text><text x="775" y="384" text-anchor="middle" class="small">联调 Stub</text>
  <rect x="880" y="342" width="150" height="62" rx="8" class="api"/><text x="955" y="366" text-anchor="middle" class="label">Message</text><text x="955" y="384" text-anchor="middle" class="small">notifications / DM</text>
  <rect x="160" y="505" width="180" height="70" rx="8" class="data"/><text x="250" y="532" text-anchor="middle" class="label">PostgreSQL</text><text x="250" y="550" text-anchor="middle" class="small">entities + repositories</text>
  <rect x="400" y="505" width="180" height="70" rx="8" class="data"/><text x="490" y="532" text-anchor="middle" class="label">File Assets</text><text x="490" y="550" text-anchor="middle" class="small">usage / audit / publicUrl</text>
  <rect x="640" y="505" width="180" height="70" rx="8" class="data"/><text x="730" y="532" text-anchor="middle" class="label">Notifications</text><text x="730" y="550" text-anchor="middle" class="small">system + private</text>
  <rect x="880" y="505" width="180" height="70" rx="8" class="risk"/><text x="970" y="532" text-anchor="middle" class="label">Unfinished</text><text x="970" y="550" text-anchor="middle" class="small">真实 AI / 支付 / 合规</text>
  <path class="line" d="M590 152 L145 205"/><path class="line" d="M590 152 L325 205"/><path class="line" d="M590 152 L505 205"/><path class="line" d="M590 152 L685 205"/><path class="line" d="M590 152 L865 205"/><path class="line" d="M590 152 L1045 205"/>
  <path class="line" d="M235 404 L250 505"/><path class="line" d="M415 404 L250 505"/><path class="line" d="M595 404 L250 505"/><path class="line" d="M775 404 L250 505"/><path class="line" d="M955 404 L730 505"/>
  <path class="line" d="M505 267 L490 505"/><path class="line" d="M685 267 L250 505"/><path class="line" d="M865 267 L490 505"/><path class="line" d="M1045 267 L970 505"/>
</svg>
