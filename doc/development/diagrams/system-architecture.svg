<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}
      .note{fill:#94a3b8;font-size:12px}
      .label{fill:#f8fafc;font-size:14px;font-weight:700}
      .small{fill:#cbd5e1;font-size:11px}
      .box{rx:12;stroke-width:1.6}
      .client{fill:#083344;stroke:#22d3ee}
      .api{fill:#064e3b;stroke:#34d399}
      .data{fill:#4c1d95;stroke:#a78bfa}
      .provider{fill:#78350f;stroke:#fbbf24}
      .risk{fill:#881337;stroke:#fb7185}
      .doc{fill:#1e293b;stroke:#94a3b8}
      .line{stroke:#94a3b8;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1180" height="720" fill="#0f172a"/>
  <rect width="1180" height="720" fill="url(#grid)"/>
  <text x="34" y="42" class="title">豆屿 Doyu 系统架构</text>
  <text x="34" y="64" class="note">当前开发态：Android + Spring Boot 单体 + PostgreSQL + Provider 骨架；真实 AI / 真实支付 / 地图 API 未接入</text>

  <rect x="40" y="112" width="210" height="110" class="box client"/>
  <text x="145" y="145" text-anchor="middle" class="label">Android App</text>
  <text x="145" y="168" text-anchor="middle" class="small">Compose / Navigation</text>
  <text x="145" y="188" text-anchor="middle" class="small">Retrofit / DataStore</text>

  <rect x="330" y="112" width="250" height="110" class="box api"/>
  <text x="455" y="145" text-anchor="middle" class="label">Spring Boot API</text>
  <text x="455" y="168" text-anchor="middle" class="small">/api/v1 统一响应</text>
  <text x="455" y="188" text-anchor="middle" class="small">Auth / Community / Commerce</text>

  <rect x="675" y="96" width="180" height="78" class="box data"/>
  <text x="765" y="128" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="765" y="151" text-anchor="middle" class="small">JPA + Flyway</text>

  <rect x="675" y="200" width="180" height="78" class="box data"/>
  <text x="765" y="232" text-anchor="middle" class="label">Redis</text>
  <text x="765" y="255" text-anchor="middle" class="small">缓存 / 限流基础设施</text>

  <rect x="940" y="96" width="190" height="78" class="box provider"/>
  <text x="1035" y="128" text-anchor="middle" class="label">OSS Provider</text>
  <text x="1035" y="151" text-anchor="middle" class="small">local | stub | aliyun</text>

  <rect x="940" y="200" width="190" height="78" class="box provider"/>
  <text x="1035" y="232" text-anchor="middle" class="label">AI Provider</text>
  <text x="1035" y="255" text-anchor="middle" class="small">Stub + 自研算法</text>

  <rect x="940" y="304" width="190" height="78" class="box provider"/>
  <text x="1035" y="336" text-anchor="middle" class="label">Payment Stub</text>
  <text x="1035" y="359" text-anchor="middle" class="small">联调支付单 / 回调骨架</text>

  <rect x="330" y="316" width="250" height="110" class="box api"/>
  <text x="455" y="350" text-anchor="middle" class="label">业务模块</text>
  <text x="455" y="373" text-anchor="middle" class="small">User / Upload / Pattern</text>
  <text x="455" y="393" text-anchor="middle" class="small">Order / Message / Reward</text>

  <rect x="675" y="330" width="180" height="78" class="box api"/>
  <text x="765" y="362" text-anchor="middle" class="label">Admin API</text>
  <text x="765" y="385" text-anchor="middle" class="small">审核 / 举报 / 运营</text>

  <rect x="40" y="500" width="250" height="96" class="box doc"/>
  <text x="165" y="532" text-anchor="middle" class="label">Open Design A</text>
  <text x="165" y="555" text-anchor="middle" class="small">HTML 原型只表达 UI 目标</text>
  <text x="165" y="575" text-anchor="middle" class="small">不代表 Android 已实现</text>

  <rect x="330" y="500" width="250" height="96" class="box doc"/>
  <text x="455" y="532" text-anchor="middle" class="label">doc/development</text>
  <text x="455" y="555" text-anchor="middle" class="small">API / 阶段 / 蓝图 / 验收</text>
  <text x="455" y="575" text-anchor="middle" class="small">公开开发文档入口</text>

  <rect x="675" y="500" width="455" height="96" class="box risk"/>
  <text x="902" y="532" text-anchor="middle" class="label">生产化未完成能力</text>
  <text x="902" y="555" text-anchor="middle" class="small">真实 AI / 地图 API / 真实支付 / 地址管理 / 合规 / 玩家交易闭环</text>
  <text x="902" y="575" text-anchor="middle" class="small">只能隐藏、禁用或标 UI-only / 开发态</text>

  <path d="M250 167 L330 167" class="line"/>
  <path d="M580 155 L675 135" class="line"/>
  <path d="M580 179 L675 239" class="line"/>
  <path d="M580 167 L940 135" class="line"/>
  <path d="M580 371 L940 239" class="line"/>
  <path d="M580 371 L940 343" class="line"/>
  <path d="M580 371 L675 369" class="line"/>
  <path d="M455 222 L455 316" class="line"/>
  <path d="M290 548 L330 548" class="line dash"/>
  <path d="M580 548 L675 548" class="line dash"/>
</svg>
