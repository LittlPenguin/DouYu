<svg viewBox="0 0 980 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text{font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif}.bg{fill:#FFFBF7}.phone{fill:#fff;stroke:#E0CDD0;stroke-width:2;rx:32}.bar{fill:#FFF0F3;stroke:#E0CDD0;rx:16}.petal{fill:#F48FA4}.mint{fill:#D4F0E0;stroke:#7DB89A;rx:14}.sky{fill:#D6E8FF;stroke:#7AADE0;rx:14}.coral{fill:#FFE8DD;stroke:#FF8F75;rx:14}.card{fill:#fff;stroke:#E0CDD0;rx:16}.line{stroke:#CDB9BE;stroke-width:1.2}.label{fill:#2F2528;font-size:16px;font-weight:800}.small{fill:#5F5257;font-size:12px}.tiny{fill:#7A6B70;font-size:10px}
    </style>
  </defs>
  <rect width="980" height="780" class="bg"/>
  <text x="38" y="48" class="label">作品详情与悬浮评论栏线框</text>
  <text x="38" y="70" class="small">顺序固定：图片 -> 内容 -> 评论区 -> 底部悬浮评论栏；含 carousel、@ 用户、# 话题和上传失败状态</text>

  <rect x="56" y="104" width="330" height="620" class="phone"/>
  <rect x="82" y="132" width="278" height="44" class="bar"/><text x="221" y="160" text-anchor="middle" class="small">返回 · 作品详情 · 更多</text>
  <rect x="82" y="196" width="278" height="178" class="sky"/><text x="221" y="260" text-anchor="middle" class="label">作品图片 Carousel</text><text x="221" y="286" text-anchor="middle" class="small">2/5 · 左右切换 · 缩略图 strip</text>
  <rect x="96" y="338" width="42" height="24" rx="8" fill="#fff"/><text x="117" y="354" text-anchor="middle" class="tiny">1</text><rect x="146" y="338" width="42" height="24" rx="8" fill="#FFE0E6" stroke="#F48FA4"/><text x="167" y="354" text-anchor="middle" class="tiny">2</text><rect x="196" y="338" width="42" height="24" rx="8" fill="#fff"/><text x="217" y="354" text-anchor="middle" class="tiny">3</text>
  <rect x="82" y="390" width="278" height="100" class="card"/><text x="104" y="418" class="small">作者 · 关注</text><text x="104" y="444" class="label">透明小岛拼豆杯垫</text><text x="104" y="468" class="tiny">正文内容、话题 Chip、点赞/收藏/评论计数</text>
  <rect x="82" y="508" width="278" height="112" class="card"/><text x="104" y="536" class="small">评论区 28</text><line x1="104" y1="552" x2="338" y2="552" class="line"/><text x="104" y="574" class="tiny">小豆友：太可爱了 @豆豆 #杯垫</text><text x="104" y="598" class="tiny">含图片评论 / 贴纸评论 / 空态 / 加载失败</text>
  <rect x="82" y="636" width="278" height="54" class="card"/><text x="104" y="668" class="tiny">写下你的评论</text><circle cx="330" cy="662" r="14" class="mint"/>

  <rect x="430" y="104" width="230" height="228" class="card"/>
  <text x="545" y="136" text-anchor="middle" class="label">展开态结构</text>
  <rect x="454" y="158" width="182" height="42" class="sky"/><text x="545" y="183" text-anchor="middle" class="tiny">图片/附件预览在上</text>
  <rect x="454" y="212" width="182" height="54" fill="#fff" stroke="#E0CDD0" rx="12"/><text x="545" y="244" text-anchor="middle" class="tiny">评论输入内容在下</text>
  <rect x="454" y="278" width="38" height="28" rx="14" class="mint"/><text x="473" y="296" text-anchor="middle" class="tiny">图</text>
  <rect x="500" y="278" width="38" height="28" rx="14" class="mint"/><text x="519" y="296" text-anchor="middle" class="tiny">@</text>
  <rect x="546" y="278" width="38" height="28" rx="14" class="mint"/><text x="565" y="296" text-anchor="middle" class="tiny">#</text>
  <rect x="592" y="278" width="44" height="28" rx="14" class="petal"/><text x="614" y="296" text-anchor="middle" class="tiny">发送</text>

  <rect x="700" y="104" width="230" height="228" class="card"/>
  <text x="815" y="136" text-anchor="middle" class="label">轮播预览</text>
  <rect x="724" y="158" width="182" height="100" class="sky"/><text x="815" y="200" text-anchor="middle" class="tiny">大图预览 · 2/5</text><text x="815" y="224" text-anchor="middle" class="tiny">左右箭头 / 滑动提示</text>
  <rect x="724" y="274" width="34" height="28" rx="8" fill="#fff"/><rect x="766" y="274" width="34" height="28" rx="8" fill="#FFE0E6" stroke="#F48FA4"/><rect x="808" y="274" width="34" height="28" rx="8" fill="#fff"/><rect x="850" y="274" width="34" height="28" rx="8" fill="#fff"/>

  <rect x="430" y="370" width="230" height="150" class="card"/>
  <text x="545" y="402" text-anchor="middle" class="label">@ 用户选择</text>
  <rect x="454" y="424" width="182" height="30" rx="15" fill="#fff" stroke="#E0CDD0"/><text x="545" y="444" text-anchor="middle" class="tiny">搜索用户</text>
  <rect x="454" y="468" width="82" height="28" rx="14" class="mint"/><text x="495" y="486" text-anchor="middle" class="tiny">@豆豆</text>
  <text x="545" y="508" text-anchor="middle" class="tiny">结果 / 已选 Chip / 空态 / 失败</text>

  <rect x="700" y="370" width="230" height="150" class="card"/>
  <text x="815" y="402" text-anchor="middle" class="label"># 话题选择</text>
  <rect x="724" y="424" width="182" height="30" rx="15" fill="#fff" stroke="#E0CDD0"/><text x="815" y="444" text-anchor="middle" class="tiny">搜索话题</text>
  <rect x="724" y="468" width="82" height="28" rx="14" class="coral"/><text x="765" y="486" text-anchor="middle" class="tiny">#杯垫</text>
  <text x="815" y="508" text-anchor="middle" class="tiny">热门 / 已选 Chip / UI 边界</text>

  <rect x="430" y="558" width="500" height="96" class="coral"/>
  <text x="680" y="590" text-anchor="middle" class="label">关键状态</text>
  <text x="680" y="616" text-anchor="middle" class="small">无图 / 一图 / 多图堆叠 / 上传中 / 上传失败可重试 / 9 图上限 / 发送禁用</text>
  <text x="680" y="640" text-anchor="middle" class="tiny">纯 @/# 不可发送；失败时不假成功；评论提交后只提示等待审核</text>
</svg>
