<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text{font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif}
      .bg{fill:#FFFBF7}
      .title{fill:#2F2528;font-size:24px;font-weight:800}
      .note{fill:#7A6B70;font-size:13px}
      .tab{fill:#FFFFFF;stroke:#F48FA4;stroke-width:1.8;rx:18}
      .section{fill:#FFF0F3;stroke:#E0CDD0;stroke-width:1.2;rx:12}
      .ui{fill:#D6E8FF;stroke:#7AADE0;stroke-width:1.2;rx:12}
      .mint{fill:#D4F0E0;stroke:#7DB89A;stroke-width:1.2;rx:12}
      .label{fill:#2F2528;font-size:14px;font-weight:800}
      .small{fill:#5F5257;font-size:11.5px}
      .tiny{fill:#7A6B70;font-size:10px}
    </style>
  </defs>
  <rect width="1180" height="760" class="bg"/>
  <text x="40" y="46" class="title">SpellBean UI Information Architecture</text>
  <text x="40" y="70" class="note">Current retained first-level areas. Bottom navigation has Community, Commerce, Messages, and Profile.</text>

  <g>
    <rect x="60" y="122" width="230" height="560" class="tab"/>
    <text x="175" y="154" text-anchor="middle" class="label">Community</text>
    <text x="175" y="176" text-anchor="middle" class="tiny">add post - community - search</text>
    <rect x="92" y="214" width="166" height="46" class="section"/><text x="175" y="242" text-anchor="middle" class="small">two-column feed</text>
    <rect x="92" y="278" width="166" height="46" class="section"/><text x="175" y="306" text-anchor="middle" class="small">post cards</text>
    <rect x="92" y="342" width="166" height="54" class="mint"/><text x="175" y="365" text-anchor="middle" class="small">post detail</text><text x="175" y="383" text-anchor="middle" class="tiny">media / content / comments</text>
    <rect x="92" y="414" width="166" height="54" class="mint"/><text x="175" y="437" text-anchor="middle" class="small">comment composer</text><text x="175" y="455" text-anchor="middle" class="tiny">text and OSS media</text>
    <rect x="92" y="486" width="166" height="46" class="ui"/><text x="175" y="514" text-anchor="middle" class="small">search boundary</text>
    <rect x="92" y="550" width="166" height="46" class="ui"/><text x="175" y="578" text-anchor="middle" class="small">post upload boundary</text>
  </g>

  <g>
    <rect x="330" y="122" width="230" height="560" class="tab"/>
    <text x="445" y="154" text-anchor="middle" class="label">Commerce</text>
    <text x="445" y="176" text-anchor="middle" class="tiny">products - cart - orders</text>
    <rect x="362" y="214" width="166" height="46" class="section"/><text x="445" y="242" text-anchor="middle" class="small">categories / product list</text>
    <rect x="362" y="278" width="166" height="46" class="section"/><text x="445" y="306" text-anchor="middle" class="small">product cards</text>
    <rect x="362" y="342" width="166" height="46" class="mint"/><text x="445" y="370" text-anchor="middle" class="small">cart</text>
    <rect x="362" y="406" width="166" height="54" class="mint"/><text x="445" y="429" text-anchor="middle" class="small">order confirm</text><text x="445" y="447" text-anchor="middle" class="tiny">address snapshot</text>
    <rect x="362" y="478" width="166" height="54" class="mint"/><text x="445" y="501" text-anchor="middle" class="small">address management</text><text x="445" y="519" text-anchor="middle" class="tiny">manual address fields</text>
  </g>

  <g>
    <rect x="600" y="122" width="230" height="560" class="tab"/>
    <text x="715" y="154" text-anchor="middle" class="label">Messages</text>
    <text x="715" y="176" text-anchor="middle" class="tiny">notifications - conversations</text>
    <rect x="632" y="214" width="166" height="46" class="section"/><text x="715" y="242" text-anchor="middle" class="small">private messages</text>
    <rect x="632" y="278" width="166" height="46" class="section"/><text x="715" y="306" text-anchor="middle" class="small">notifications</text>
    <rect x="632" y="342" width="166" height="54" class="mint"/><text x="715" y="365" text-anchor="middle" class="small">conversation detail</text><text x="715" y="383" text-anchor="middle" class="tiny">mutual-follow rules</text>
    <rect x="632" y="414" width="166" height="54" class="ui"/><text x="715" y="437" text-anchor="middle" class="small">notification detail</text><text x="715" y="455" text-anchor="middle" class="tiny">read-only event view</text>
  </g>

  <g>
    <rect x="870" y="122" width="230" height="560" class="tab"/>
    <text x="985" y="154" text-anchor="middle" class="label">Profile</text>
    <text x="985" y="176" text-anchor="middle" class="tiny">profile - settings - uploads</text>
    <rect x="902" y="214" width="166" height="54" class="section"/><text x="985" y="237" text-anchor="middle" class="small">profile header</text><text x="985" y="255" text-anchor="middle" class="tiny">edit profile entry</text>
    <rect x="902" y="286" width="166" height="54" class="section"/><text x="985" y="309" text-anchor="middle" class="small">stats</text><text x="985" y="327" text-anchor="middle" class="tiny">likes / posts / follows</text>
    <rect x="902" y="358" width="166" height="54" class="mint"/><text x="985" y="381" text-anchor="middle" class="small">asset tabs</text><text x="985" y="399" text-anchor="middle" class="tiny">liked / favorite posts</text>
    <rect x="902" y="430" width="166" height="54" class="ui"/><text x="985" y="453" text-anchor="middle" class="small">profile edit</text><text x="985" y="471" text-anchor="middle" class="tiny">avatar OSS upload</text>
    <rect x="902" y="502" width="166" height="54" class="ui"/><text x="985" y="525" text-anchor="middle" class="small">settings child pages</text><text x="985" y="543" text-anchor="middle" class="tiny">account / privacy / about</text>
  </g>

  <rect x="280" y="704" width="620" height="34" rx="17" fill="#FFFFFF" stroke="#E0CDD0"/>
  <text x="590" y="726" text-anchor="middle" class="small">Bottom navigation: Community / Commerce / Messages / Profile</text>
</svg>
