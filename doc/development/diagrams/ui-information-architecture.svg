<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text{font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif}
      .bg{fill:#FFFBF7}.title{fill:#2F2528;font-size:24px;font-weight:800}.note{fill:#7A6B70;font-size:13px}
      .tab{fill:#FFFFFF;stroke:#F48FA4;stroke-width:1.8;rx:18}.section{fill:#FFF0F3;stroke:#E0CDD0;stroke-width:1.2;rx:12}.ui{fill:#D6E8FF;stroke:#7AADE0;stroke-width:1.2;rx:12}.dev{fill:#FFE8DD;stroke:#FF8F75;stroke-width:1.2;rx:12}.mint{fill:#D4F0E0;stroke:#7DB89A;stroke-width:1.2;rx:12}
      .label{fill:#2F2528;font-size:14px;font-weight:800}.small{fill:#5F5257;font-size:11.5px}.tiny{fill:#7A6B70;font-size:10px}
      .line{stroke:#CDB9BE;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="1180" height="760" class="bg"/>
  <text x="40" y="46" class="title">豆屿 UI 信息架构</text>
  <text x="40" y="70" class="note">五个主 Tab 统一顶部栏与底部 Logo 导航；黄色/蓝色节点为 UI-only 或后续落地目标</text>

  <g>
    <rect x="46" y="122" width="196" height="560" class="tab"/>
    <text x="144" y="154" text-anchor="middle" class="label">社区</text>
    <text x="144" y="176" text-anchor="middle" class="tiny">新增 icon - 社区 - 搜索</text>
    <rect x="70" y="214" width="148" height="46" class="section"/><text x="144" y="242" text-anchor="middle" class="small">双列瀑布流</text>
    <rect x="70" y="278" width="148" height="46" class="section"/><text x="144" y="306" text-anchor="middle" class="small">作品卡片</text>
    <rect x="70" y="342" width="148" height="54" class="mint"/><text x="144" y="365" text-anchor="middle" class="small">作品详情</text><text x="144" y="383" text-anchor="middle" class="tiny">图片 -> 内容 -> 评论</text>
    <rect x="70" y="414" width="148" height="54" class="mint"/><text x="144" y="437" text-anchor="middle" class="small">悬浮评论栏</text><text x="144" y="455" text-anchor="middle" class="tiny">图 / @ / # / 贴纸</text>
    <rect x="70" y="486" width="148" height="46" class="ui"/><text x="144" y="514" text-anchor="middle" class="small">Search UI-only</text>
    <rect x="70" y="550" width="148" height="46" class="ui"/><text x="144" y="578" text-anchor="middle" class="small">上传帖子目标</text>
  </g>

  <g>
    <rect x="270" y="122" width="196" height="560" class="tab"/>
    <text x="368" y="154" text-anchor="middle" class="label">商城</text>
    <text x="368" y="176" text-anchor="middle" class="tiny">新增 icon - 商城 - 搜索</text>
    <rect x="294" y="214" width="148" height="46" class="section"/><text x="368" y="242" text-anchor="middle" class="small">分类 / 推荐</text>
    <rect x="294" y="278" width="148" height="46" class="section"/><text x="368" y="306" text-anchor="middle" class="small">商品卡</text>
    <rect x="294" y="342" width="148" height="46" class="mint"/><text x="368" y="370" text-anchor="middle" class="small">购物车</text>
    <rect x="294" y="406" width="148" height="54" class="dev"/><text x="368" y="429" text-anchor="middle" class="small">订单确认</text><text x="368" y="447" text-anchor="middle" class="tiny">地址缺口</text>
    <rect x="294" y="478" width="148" height="54" class="dev"/><text x="368" y="501" text-anchor="middle" class="small">联调支付</text><text x="368" y="519" text-anchor="middle" class="tiny">非真实支付</text>
  </g>

  <g>
    <rect x="494" y="122" width="196" height="560" class="tab"/>
    <text x="592" y="154" text-anchor="middle" class="label">AI</text>
    <text x="592" y="176" text-anchor="middle" class="tiny">新增 icon - AI 创作 - 搜索</text>
    <rect x="518" y="214" width="148" height="46" class="section"/><text x="592" y="242" text-anchor="middle" class="small">创作入口</text>
    <rect x="518" y="278" width="148" height="46" class="mint"/><text x="592" y="306" text-anchor="middle" class="small">任务卡</text>
    <rect x="518" y="342" width="148" height="46" class="mint"/><text x="592" y="370" text-anchor="middle" class="small">历史记录</text>
    <rect x="518" y="406" width="148" height="54" class="dev"/><text x="592" y="429" text-anchor="middle" class="small">开发态结果</text><text x="592" y="447" text-anchor="middle" class="tiny">真实 Provider 未接</text>
    <rect x="518" y="478" width="148" height="54" class="ui"/><text x="592" y="501" text-anchor="middle" class="small">未来生图</text><text x="592" y="519" text-anchor="middle" class="tiny">UI-only</text>
  </g>

  <g>
    <rect x="718" y="122" width="196" height="560" class="tab"/>
    <text x="816" y="154" text-anchor="middle" class="label">消息</text>
    <text x="816" y="176" text-anchor="middle" class="tiny">新增 icon - 消息 - 搜索</text>
    <rect x="742" y="214" width="148" height="46" class="section"/><text x="816" y="242" text-anchor="middle" class="small">私信 Tab</text>
    <rect x="742" y="278" width="148" height="46" class="section"/><text x="816" y="306" text-anchor="middle" class="small">通知 Tab</text>
    <rect x="742" y="342" width="148" height="54" class="mint"/><text x="816" y="365" text-anchor="middle" class="small">对话详情</text><text x="816" y="383" text-anchor="middle" class="tiny">互关 / 3 条限制</text>
    <rect x="742" y="414" width="148" height="54" class="ui"/><text x="816" y="437" text-anchor="middle" class="small">通知详情</text><text x="816" y="455" text-anchor="middle" class="tiny">UI-only 目标</text>
  </g>

  <g>
    <rect x="942" y="122" width="196" height="560" class="tab"/>
    <text x="1040" y="154" text-anchor="middle" class="label">我的</text>
    <text x="1040" y="176" text-anchor="middle" class="tiny">新增 icon - 我的 - 搜索</text>
    <rect x="966" y="214" width="148" height="54" class="section"/><text x="1040" y="237" text-anchor="middle" class="small">资料区</text><text x="1040" y="255" text-anchor="middle" class="tiny">编辑资料入口</text>
    <rect x="966" y="286" width="148" height="54" class="section"/><text x="1040" y="309" text-anchor="middle" class="small">获赞 / 作品</text><text x="1040" y="327" text-anchor="middle" class="tiny">关注 / 粉丝</text>
    <rect x="966" y="358" width="148" height="54" class="mint"/><text x="1040" y="381" text-anchor="middle" class="small">三资产 Tab</text><text x="1040" y="399" text-anchor="middle" class="tiny">图纸 / 点赞 / 收藏</text>
    <rect x="966" y="430" width="148" height="54" class="ui"/><text x="1040" y="453" text-anchor="middle" class="small">Profile Edit</text><text x="1040" y="471" text-anchor="middle" class="tiny">UI-only / 待接</text>
    <rect x="966" y="502" width="148" height="54" class="ui"/><text x="1040" y="525" text-anchor="middle" class="small">Settings 子页</text><text x="1040" y="543" text-anchor="middle" class="tiny">合规待补</text>
  </g>

  <rect x="280" y="704" width="620" height="34" rx="17" fill="#FFFFFF" stroke="#E0CDD0"/>
  <text x="590" y="726" text-anchor="middle" class="small">底部 Logo 导航：社区 / 商城 / AI / 消息 / 我的</text>
</svg>
