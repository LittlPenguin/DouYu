<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:"JetBrains Mono","Noto Sans SC","PingFang SC",sans-serif}.bg{fill:#0f172a}.title{fill:#f8fafc;font-size:20px;font-weight:700}.note{fill:#94a3b8;font-size:10px}
      .a{fill:rgba(8,51,68,.55);stroke:#22d3ee;stroke-width:1.5}.b{fill:rgba(6,78,59,.5);stroke:#34d399;stroke-width:1.5}.d{fill:rgba(120,53,15,.35);stroke:#fbbf24;stroke-width:1.5}.e{fill:rgba(136,19,55,.42);stroke:#fb7185;stroke-width:1.5}.v{fill:rgba(76,29,149,.45);stroke:#a78bfa;stroke-width:1.5}
      .label{fill:#f8fafc;font-size:12px;font-weight:700}.small{fill:#cbd5e1;font-size:9px}.line{fill:none;stroke:#94a3b8;stroke-width:1.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1040" height="820" class="bg"/>
  <text x="34" y="38" class="title">社区评论 MVP 流程</text>
  <text x="34" y="58" class="note">评论支持文字、图片、@ 用户、# 话题、内置贴纸；视频评论和自定义贴纸不在第六轮关闭</text>
  <rect x="400" y="90" width="240" height="58" rx="8" class="a"/><text x="520" y="114" text-anchor="middle" class="label">展开评论工具条</text><text x="520" y="131" text-anchor="middle" class="small">折叠态 -> 分层输入区</text>
  <rect x="80" y="205" width="180" height="58" rx="8" class="a"/><text x="170" y="229" text-anchor="middle" class="label">输入文字</text><text x="170" y="246" text-anchor="middle" class="small">可为空</text>
  <rect x="300" y="205" width="180" height="58" rx="8" class="a"/><text x="390" y="229" text-anchor="middle" class="label">选择图片</text><text x="390" y="246" text-anchor="middle" class="small">最多 9 张</text>
  <rect x="520" y="205" width="180" height="58" rx="8" class="a"/><text x="610" y="229" text-anchor="middle" class="label">@ 用户 / # 话题</text><text x="610" y="246" text-anchor="middle" class="small">真实搜索</text>
  <rect x="740" y="205" width="180" height="58" rx="8" class="a"/><text x="830" y="229" text-anchor="middle" class="label">选择贴纸</text><text x="830" y="246" text-anchor="middle" class="small">内置 sticker-pack</text>
  <rect x="300" y="330" width="180" height="58" rx="8" class="b"/><text x="390" y="354" text-anchor="middle" class="label">上传图片</text><text x="390" y="371" text-anchor="middle" class="small">POST_IMAGE</text>
  <rect x="300" y="455" width="180" height="58" rx="8" class="v"/><text x="390" y="479" text-anchor="middle" class="label">FileAsset</text><text x="390" y="496" text-anchor="middle" class="small">ownerId + publicUrl</text>
  <polygon points="520,430 605,485 520,540 435,485" class="d"/><text x="520" y="482" text-anchor="middle" class="label">有效评论?</text><text x="520" y="499" text-anchor="middle" class="small">文字/图片/贴纸至少一项</text>
  <rect x="700" y="455" width="220" height="58" rx="8" class="e"/><text x="810" y="479" text-anchor="middle" class="label">阻断提交</text><text x="810" y="496" text-anchor="middle" class="small">保留已选内容并提示</text>
  <rect x="400" y="595" width="240" height="58" rx="8" class="b"/><text x="520" y="619" text-anchor="middle" class="label">POST /posts/{id}/comments</text><text x="520" y="636" text-anchor="middle" class="small">content/media/mentions/topics/stickers</text>
  <rect x="400" y="705" width="240" height="58" rx="8" class="v"/><text x="520" y="729" text-anchor="middle" class="label">REVIEWING + 列表渲染</text><text x="520" y="746" text-anchor="middle" class="small">mediaAssets / @ / # / stickers</text>
  <path class="line" d="M520 148 L170 205"/><path class="line" d="M520 148 L390 205"/><path class="line" d="M520 148 L610 205"/><path class="line" d="M520 148 L830 205"/>
  <path class="line" d="M390 263 L390 330"/><path class="line" d="M390 388 L390 455"/><path class="line" d="M170 263 L455 454"/><path class="line" d="M610 263 L560 433"/><path class="line" d="M830 263 L575 454"/>
  <path class="line" d="M605 485 L700 485"/><path class="line" d="M520 540 L520 595"/><path class="line" d="M520 653 L520 705"/>
  <text x="622" y="475" class="small" fill="#fb7185">否</text><text x="535" y="565" class="small" fill="#34d399">是</text>
</svg>
