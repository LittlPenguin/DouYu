<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .box{rx:12;stroke-width:1.5}.ui{fill:#083344;stroke:#22d3ee}.api{fill:#064e3b;stroke:#34d399}.decision{fill:#78350f;stroke:#fbbf24}.error{fill:#881337;stroke:#fb7185}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10.5px}.line{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="700" fill="#0f172a"/><rect width="1180" height="700" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Community Comment Flow</text>
  <text x="34" y="64" class="note">评论支持文字 / 图片 / @ / # / 贴纸；图片最多 9 张，上传失败不得假成功</text>
  <rect x="62" y="118" width="210" height="80" class="box ui"/><text x="167" y="150" text-anchor="middle" class="label">展开悬浮评论栏</text><text x="167" y="174" text-anchor="middle" class="small">图片在上 / 输入在下</text>
  <rect x="332" y="118" width="210" height="80" class="box ui"/><text x="437" y="150" text-anchor="middle" class="label">选择内容</text><text x="437" y="174" text-anchor="middle" class="small">文字 / 图片 / @ / # / 贴纸</text>
  <rect x="602" y="118" width="210" height="80" class="box decision"/><text x="707" y="150" text-anchor="middle" class="label">是否有图片?</text><text x="707" y="174" text-anchor="middle" class="small">最多 9 张</text>
  <rect x="872" y="92" width="230" height="80" class="box api"/><text x="987" y="124" text-anchor="middle" class="label">上传链路</text><text x="987" y="148" text-anchor="middle" class="small">presign -> PUT -> confirm</text>
  <rect x="872" y="214" width="230" height="80" class="box error"/><text x="987" y="246" text-anchor="middle" class="label">上传失败</text><text x="987" y="270" text-anchor="middle" class="small">保留缩略图 / 可重试</text>

  <rect x="180" y="350" width="240" height="86" class="box decision"/><text x="300" y="382" text-anchor="middle" class="label">可提交?</text><text x="300" y="406" text-anchor="middle" class="small">文字 / 图片 / 贴纸至少一种</text>
  <rect x="500" y="350" width="240" height="86" class="box api"/><text x="620" y="382" text-anchor="middle" class="label">POST /posts/{id}/comments</text><text x="620" y="406" text-anchor="middle" class="small">content + media + mentions + topics</text>
  <rect x="820" y="350" width="240" height="86" class="box api"/><text x="940" y="382" text-anchor="middle" class="label">返回 VISIBLE</text><text x="940" y="406" text-anchor="middle" class="small">短提示：评论成功</text>
  <rect x="180" y="520" width="240" height="86" class="box error"/><text x="300" y="552" text-anchor="middle" class="label">禁止提交</text><text x="300" y="576" text-anchor="middle" class="small">纯 @/# 或无内容</text>
  <rect x="500" y="520" width="240" height="86" class="box ui"/><text x="620" y="552" text-anchor="middle" class="label">评论列表渲染</text><text x="620" y="576" text-anchor="middle" class="small">图片 / @ / # / 贴纸 / 空态 / 失败</text>

  <path d="M272 158 L332 158" class="line"/><path d="M542 158 L602 158" class="line"/><path d="M812 139 L872 132" class="line"/><path d="M987 172 L987 214" class="line"/>
  <path d="M707 198 C700 270 380 278 300 350" class="line"/><path d="M420 393 L500 393" class="line"/><path d="M740 393 L820 393" class="line"/>
  <path d="M300 436 L300 520" class="line"/><path d="M940 436 C940 510 720 500 620 520" class="line"/>
  <text x="846" y="116" class="small">是</text><text x="654" y="252" class="small">否或上传成功</text>
</svg>
