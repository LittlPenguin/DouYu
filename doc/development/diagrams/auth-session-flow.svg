<svg viewBox="0 0 1160 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .box{rx:12;stroke-width:1.5}.start{fill:#083344;stroke:#22d3ee}.api{fill:#064e3b;stroke:#34d399}.store{fill:#4c1d95;stroke:#a78bfa}.decision{fill:#78350f;stroke:#fbbf24}.end{fill:#881337;stroke:#fb7185}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10.5px}.line{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="620" fill="#0f172a"/><rect width="1160" height="620" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Auth Session Flow</text>
  <text x="34" y="64" class="note">用户侧使用邮箱密码注册和登录；SharedPreferences 是 Android 登录态持久化事实</text>

  <rect x="60" y="120" width="180" height="70" class="box start"/><text x="150" y="150" text-anchor="middle" class="label">输入邮箱密码</text><text x="150" y="172" text-anchor="middle" class="small">登录或注册</text>
  <rect x="300" y="120" width="190" height="70" class="box api"/><text x="395" y="150" text-anchor="middle" class="label">POST /register</text><text x="395" y="172" text-anchor="middle" class="small">email + password</text>
  <rect x="550" y="120" width="220" height="70" class="box api"/><text x="660" y="150" text-anchor="middle" class="label">POST /login</text><text x="660" y="172" text-anchor="middle" class="small">email + password</text>
  <rect x="830" y="120" width="220" height="70" class="box store"/><text x="940" y="150" text-anchor="middle" class="label">保存 Token</text><text x="940" y="172" text-anchor="middle" class="small">access / refresh / user</text>

  <rect x="60" y="300" width="180" height="70" class="box store"/><text x="150" y="330" text-anchor="middle" class="label">App 启动</text><text x="150" y="352" text-anchor="middle" class="small">SharedPreferences hydrate</text>
  <rect x="300" y="300" width="190" height="70" class="box api"/><text x="395" y="330" text-anchor="middle" class="label">携带 Bearer</text><text x="395" y="352" text-anchor="middle" class="small">访问受保护接口</text>
  <rect x="560" y="292" width="200" height="86" class="box decision"/><text x="660" y="325" text-anchor="middle" class="label">返回 401?</text><text x="660" y="350" text-anchor="middle" class="small">过期或无效</text>
  <rect x="830" y="270" width="220" height="70" class="box api"/><text x="940" y="300" text-anchor="middle" class="label">POST /refresh</text><text x="940" y="322" text-anchor="middle" class="small">更新 TokenStore</text>
  <rect x="830" y="392" width="220" height="70" class="box end"/><text x="940" y="422" text-anchor="middle" class="label">清理会话</text><text x="940" y="444" text-anchor="middle" class="small">logout / refresh fail</text>

  <path d="M240 155 L300 155" class="line"/><path d="M490 155 L550 155" class="line"/><path d="M770 155 L830 155" class="line"/>
  <path d="M150 190 L150 300" class="line"/><path d="M240 335 L300 335" class="line"/><path d="M490 335 L560 335" class="line"/>
  <path d="M760 314 L830 305" class="line"/><path d="M760 356 L830 427" class="line"/>
  <path d="M940 270 C940 230 940 220 940 190" class="line"/>
  <text x="788" y="294" class="small">是</text><text x="790" y="392" class="small">否或失败</text>
</svg>
