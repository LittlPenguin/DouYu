<svg viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',sans-serif}
      .title{fill:#f8fafc;font-size:22px;font-weight:700}.note{fill:#94a3b8;font-size:12px}
      .box{rx:12;stroke-width:1.5}.ui{fill:#083344;stroke:#22d3ee}.api{fill:#064e3b;stroke:#34d399}.decision{fill:#78350f;stroke:#fbbf24}.warn{fill:#881337;stroke:#fb7185}
      .label{fill:#f8fafc;font-size:13px;font-weight:700}.small{fill:#cbd5e1;font-size:10.5px}.line{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="660" fill="#0f172a"/><rect width="1180" height="660" fill="url(#grid)"/>
  <text x="34" y="42" class="title">Commerce Order Payment Flow</text>
  <text x="34" y="64" class="note">真实支付未接入；支付页只能表达联调支付单与服务端状态查询</text>
  <rect x="64" y="120" width="190" height="76" class="box ui"/><text x="159" y="150" text-anchor="middle" class="label">商品详情</text><text x="159" y="172" text-anchor="middle" class="small">自营 / 玩家类型</text>
  <rect x="316" y="120" width="210" height="76" class="box decision"/><text x="421" y="150" text-anchor="middle" class="label">SELF_OPERATED?</text><text x="421" y="172" text-anchor="middle" class="small">玩家商品不进购物车</text>
  <rect x="588" y="88" width="210" height="76" class="box api"/><text x="693" y="118" text-anchor="middle" class="label">Cart</text><text x="693" y="140" text-anchor="middle" class="small">GET / POST / PATCH / DELETE</text>
  <rect x="588" y="206" width="210" height="76" class="box warn"/><text x="693" y="236" text-anchor="middle" class="label">禁用标准购买</text><text x="693" y="258" text-anchor="middle" class="small">展示咨询 / 开发态边界</text>
  <rect x="860" y="88" width="210" height="76" class="box decision"/><text x="965" y="118" text-anchor="middle" class="label">地址可用?</text><text x="965" y="140" text-anchor="middle" class="small">地址管理未闭环</text>
  <rect x="860" y="206" width="210" height="76" class="box warn"/><text x="965" y="236" text-anchor="middle" class="label">地址缺口</text><text x="965" y="258" text-anchor="middle" class="small">禁用创建订单</text>

  <rect x="220" y="390" width="220" height="82" class="box api"/><text x="330" y="422" text-anchor="middle" class="label">POST /orders</text><text x="330" y="446" text-anchor="middle" class="small">Idempotency-Key</text>
  <rect x="500" y="390" width="220" height="82" class="box api"/><text x="610" y="422" text-anchor="middle" class="label">POST /payments</text><text x="610" y="446" text-anchor="middle" class="small">provider = STUB</text>
  <rect x="780" y="390" width="220" height="82" class="box ui"/><text x="890" y="422" text-anchor="middle" class="label">支付状态页</text><text x="890" y="446" text-anchor="middle" class="small">查询服务端最终状态</text>
  <rect x="500" y="530" width="310" height="76" class="box warn"/><text x="655" y="560" text-anchor="middle" class="label">禁止误导</text><text x="655" y="582" text-anchor="middle" class="small">不展示真实微信 / 支付宝完成态</text>

  <path d="M254 158 L316 158" class="line"/><path d="M526 136 L588 126" class="line"/><path d="M526 180 L588 244" class="line"/><path d="M798 126 L860 126" class="line"/><path d="M965 164 L965 206" class="line"/>
  <path d="M965 126 C1070 250 500 320 330 390" class="line"/><path d="M440 431 L500 431" class="line"/><path d="M720 431 L780 431" class="line"/><path d="M890 472 C870 525 785 538 810 568" class="line"/>
</svg>
