<svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text{font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif}
      .bg{fill:#FFFBF7}.phone{fill:#fff;stroke:#E0CDD0;stroke-width:2;rx:32}.bar{fill:#FFF0F3;stroke:#E0CDD0;rx:16}
      .petal{fill:#F48FA4}.mint{fill:#D4F0E0;stroke:#7DB89A;rx:14}.sky{fill:#D6E8FF;stroke:#7AADE0;rx:14}.card{fill:#fff;stroke:#E0CDD0;rx:16}.img{fill:#FFE0E6;rx:14}
      .label{fill:#2F2528;font-size:16px;font-weight:800}.small{fill:#5F5257;font-size:12px}.tiny{fill:#7A6B70;font-size:10px}
    </style>
  </defs>
  <rect width="760" height="760" class="bg"/>
  <text x="38" y="48" class="label">Community Home Wireframe</text>
  <text x="38" y="70" class="small">Two-column real post feed with search and post upload boundaries.</text>
  <rect x="220" y="100" width="320" height="620" class="phone"/>
  <rect x="244" y="128" width="272" height="48" class="bar"/>
  <circle cx="270" cy="152" r="13" class="petal"/><text x="380" y="158" text-anchor="middle" class="label">Community</text><circle cx="490" cy="152" r="13" fill="#9EC9F5"/>
  <rect x="244" y="194" width="72" height="30" rx="15" fill="#FFE0E6"/><text x="280" y="214" text-anchor="middle" class="tiny">For you</text>
  <rect x="326" y="194" width="72" height="30" rx="15" fill="#fff" stroke="#E0CDD0"/><text x="362" y="214" text-anchor="middle" class="tiny">Following</text>
  <rect x="408" y="194" width="72" height="30" rx="15" fill="#fff" stroke="#E0CDD0"/><text x="444" y="214" text-anchor="middle" class="tiny">Topics</text>
  <rect x="244" y="246" width="126" height="184" class="card"/><rect x="254" y="256" width="106" height="112" class="img"/><text x="307" y="318" text-anchor="middle" class="tiny">OSS cover</text><text x="254" y="390" class="tiny">post title</text><text x="254" y="412" class="tiny">author / likes</text>
  <rect x="390" y="246" width="126" height="238" class="card"/><rect x="400" y="256" width="106" height="162" class="sky"/><text x="453" y="342" text-anchor="middle" class="tiny">tall media</text><text x="400" y="440" class="tiny">post title</text><text x="400" y="462" class="tiny">comments</text>
  <rect x="244" y="448" width="126" height="222" class="card"/><rect x="254" y="458" width="106" height="146" class="mint"/><text x="307" y="534" text-anchor="middle" class="tiny">review state</text><text x="254" y="626" class="tiny">post title</text><text x="254" y="648" class="tiny">favorite count</text>
  <rect x="390" y="502" width="126" height="168" class="card"/><rect x="400" y="512" width="106" height="96" class="img"/><text x="453" y="565" text-anchor="middle" class="tiny">fallback</text><text x="400" y="630" class="tiny">post title</text><text x="400" y="652" class="tiny">likes</text>
  <rect x="242" y="674" width="276" height="40" rx="20" fill="#FFFAF7" stroke="#E0CDD0"/>
  <rect x="248" y="680" width="58" height="28" rx="14" fill="#FFE0E6"/><circle cx="277" cy="690" r="4" class="petal"/><text x="277" y="704" text-anchor="middle" class="tiny">Community</text><rect x="265" y="709" width="24" height="3" rx="2" class="petal"/>
  <circle cx="346" cy="690" r="4" fill="#7A6B70"/><text x="346" y="704" text-anchor="middle" class="tiny">Commerce</text>
  <circle cx="422" cy="690" r="4" fill="#7A6B70"/><text x="422" y="704" text-anchor="middle" class="tiny">Messages</text>
  <circle cx="488" cy="690" r="4" fill="#7A6B70"/><text x="488" y="704" text-anchor="middle" class="tiny">Profile</text>
</svg>
