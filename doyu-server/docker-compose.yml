services:
  postgres:
    image: postgres:16
    container_name: douyu-postgres
    environment:
      POSTGRES_DB: douyu
      POSTGRES_USER: douyu
      POSTGRES_PASSWORD: douyu_dev_password
    ports:
      - "5433:5432"
    volumes:
      - douyu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U douyu -d douyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: douyu-redis
    ports:
      - "6379:6379"
    volumes:
      - douyu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  douyu_postgres_data:
  douyu_redis_data: