spring:
  datasource:
    url: ${DOUYU_QA_EMPTY_POSTGRES_URL:jdbc:postgresql://localhost:55433/douyu_qa_empty}
    username: ${DOUYU_QA_EMPTY_POSTGRES_USER:douyu_qa}
    password: ${DOUYU_QA_EMPTY_POSTGRES_PASSWORD:douyu_qa_password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${DOUYU_QA_EMPTY_REDIS_HOST:localhost}
      port: ${DOUYU_QA_EMPTY_REDIS_PORT:56379}

douyu:
  qa-empty:
    enabled: true
    database-role: isolated-empty
  storage:
    local-path: ${DOUYU_QA_EMPTY_STORAGE_PATH:./target/doyu-qa-empty-storage}
    base-url: ${DOUYU_STORAGE_BASE_URL:http://localhost:8082}
  oss:
    provider: ${DOUYU_OSS_PROVIDER:local}
