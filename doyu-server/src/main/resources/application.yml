spring:
  application:
    name: doyu-server
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

mybatis:
  configuration:
    map-underscore-to-camel-case: true

douyu:
  jwt:
    issuer: douyu
    secret: ${DOUYU_JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
  sms:
    stub-code: "123456"
  admin:
    bootstrap-username: ${DOUYU_ADMIN_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${DOUYU_ADMIN_BOOTSTRAP_PASSWORD:admin123}
