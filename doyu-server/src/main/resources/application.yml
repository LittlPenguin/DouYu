spring:
  application:
    name: doyu-server
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${DOUYU_BACKEND_PORT:8081}
  address: ${DOUYU_SERVER_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis:
  configuration:
    map-underscore-to-camel-case: true

douyu:
  jwt:
    issuer: douyu
    secret: ${DOUYU_JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
  admin:
    bootstrap-username: ${DOUYU_ADMIN_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${DOUYU_ADMIN_BOOTSTRAP_PASSWORD:admin123}
  oss:
    provider: ${DOUYU_OSS_PROVIDER:local}
    aliyun:
      endpoint: ${DOUYU_ALIYUN_OSS_ENDPOINT:}
      region: ${DOUYU_ALIYUN_OSS_REGION:}
      bucket: ${DOUYU_ALIYUN_OSS_BUCKET:}
      access-key-id: ${DOUYU_ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${DOUYU_ALIYUN_OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${DOUYU_ALIYUN_OSS_PUBLIC_BASE_URL:}
