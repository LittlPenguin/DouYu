spring:
  application:
    name: doyu-server
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mybatis:
  configuration:
    map-underscore-to-camel-case: true

douyu:
  jwt:
    issuer: douyu
    secret: ${DOUYU_JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
  sms:
    stub-code: "123456"
  admin:
    bootstrap-username: ${DOUYU_ADMIN_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${DOUYU_ADMIN_BOOTSTRAP_PASSWORD:admin123}
  oss:
    provider: ${DOUYU_OSS_PROVIDER:local}
  ai:
    provider:
      name: ${DOUYU_AI_PROVIDER:stub}
      vision-model: ${DOUYU_AI_VISION_MODEL:stub-vision-v1}
      prepare-model: ${DOUYU_AI_PREPARE_MODEL:stub-prepare-v1}
      timeout-ms: ${DOUYU_AI_TIMEOUT_MS:30000}
      prepare-enabled: ${DOUYU_AI_PREPARE_ENABLED:false}
